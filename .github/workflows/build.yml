name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the self tests
        shell: powershell
        run: .\build.ps1 -Test

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: Wincy-windows
          path: dist\Wincy.exe
          if-no-files-found: error

      - name: Attach the executable to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\Wincy.exe
          generate_release_notes: true
